name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate dark blue snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563EB&color_dots=%23020617,%230F172A,%23172554,%231E3A8A,%233B82F6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%233B82F6&color_dots=%23020617,%230F172A,%23172554,%231E3A8A,%232563EB

      - name: Publish animations to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
